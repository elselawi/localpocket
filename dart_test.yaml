# Test configuration.
#
# Tests tagged `real` hit the live PocketBase server configured in
# `test/secret.dart`. They need network access and valid credentials, so they
# are skipped in the default run to keep the local verification hermetic and
# offline-safe.
#
# Tests tagged `gate` start nested `dart` processes for the release and web
# checks. They cannot run in the normal parallel test pass because the nested
# process collides with the runner's sqlite3.dll native-asset build hook. These
# checks are meant to run sequentially under the release runner.
#
# To run all skipped suites manually:
#   dart test --tags "gate || real" --run-skipped -j 1 test/release/ test/platform/web/ test/e2e/real/
tags:
  real:
    skip: "Live PocketBase tests — run with: dart test --tags real --run-skipped test/e2e/"
  gate:
    skip: 'Release and web gate tests — run with: dart test --tags "gate || real" --run-skipped -j 1 test/release/ test/platform/web/ test/e2e/real/'
