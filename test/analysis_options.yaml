include: ../analysis_options.yaml

# Test fixtures intentionally use dynamic wire/database values and synchronous
# filesystem setup in several integration helpers. Keep the production lint
# policy inherited while relaxing only rules that conflict with those fixtures.
analyzer:
  errors:
    strict_raw_type: ignore

linter:
  rules:
    avoid_dynamic_calls: false
    avoid_print: false
    avoid_slow_async_io: false
    cast_nullable_to_non_nullable: false
    close_sinks: false
    prefer_const_constructors: false
    prefer_const_declarations: false
