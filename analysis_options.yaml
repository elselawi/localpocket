include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # The compile-fail corpus contains code that MUST fail to compile; it is
    # analyzed file-by-file by tool/compile_fail_runner.dart instead.
    - test/compile_fail/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unused_element: error
    unused_field: error
    unused_shown_name: error
    unused_label: error

    # Async correctness
    discarded_futures: error
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error

    # Type/API correctness
    invalid_assignment: error
    argument_type_not_assignable: error
    return_of_invalid_type: error
    undefined_class: error
    undefined_function: error
    undefined_method: error
    undefined_named_parameter: error
    undefined_getter: error
    undefined_setter: error

linter:
  rules:
    # ---------------------------------------------------------------------------
    # API / LIBRARY QUALITY
    # ---------------------------------------------------------------------------

    - always_declare_return_types
    - always_put_required_named_parameters_first
    - annotate_overrides
    - avoid_annotating_with_dynamic
    - avoid_dynamic_calls
    - library_private_types_in_public_api
    - package_api_docs
    - public_member_api_docs

    # ---------------------------------------------------------------------------
    # TYPE SAFETY
    # ---------------------------------------------------------------------------

    - avoid_types_as_parameter_names
    - cast_nullable_to_non_nullable
    - hash_and_equals
    - test_types_in_equals
    - tighten_type_of_initializing_formals

    # ---------------------------------------------------------------------------
    # ASYNC / RESOURCE MANAGEMENT
    # ---------------------------------------------------------------------------

    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_slow_async_io
    - avoid_returning_null_for_future

    # ---------------------------------------------------------------------------
    # IMMUTABILITY / STATE
    # ---------------------------------------------------------------------------

    - prefer_final_fields
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # ---------------------------------------------------------------------------
    # CONTROL FLOW / CORRECTNESS
    # ---------------------------------------------------------------------------

    - literal_only_boolean_expressions
    - unnecessary_this
    - unnecessary_const
    - unnecessary_new
    - no_adjacent_strings_in_list

    # ---------------------------------------------------------------------------
    # DESIGN / MAINTAINABILITY
    # ---------------------------------------------------------------------------

    - avoid_setters_without_getters
    - avoid_unnecessary_containers
    - prefer_asserts_with_message
    - use_enums

    # ---------------------------------------------------------------------------
    # NAMING / DOCUMENTATION / STYLE
    # ---------------------------------------------------------------------------

    - prefer_single_quotes
    - slash_for_doc_comments
    - sort_constructors_first

    # ---------------------------------------------------------------------------
    # GENERAL QUALITY
    # ---------------------------------------------------------------------------

    - avoid_print
    - prefer_expression_function_bodies
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_contains
    - prefer_if_null_operators
    - prefer_null_aware_operators
    - use_string_buffers
    - use_super_parameters
